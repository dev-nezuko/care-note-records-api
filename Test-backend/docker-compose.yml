services:
  api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      CARE_NOTES_CORS_ORIGINS: ${CARE_NOTES_CORS_ORIGINS:-http://localhost:3000}
    volumes:
      - notes-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  notes-data:
